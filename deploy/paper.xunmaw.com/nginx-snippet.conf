# paper.xunmaw.com Nginx 鐗囨 鈥?杩藉姞鍒?/etc/nginx/start.conf 鏈熬

    server {
        listen       80;
        server_name  paper.xunmaw.com;
        rewrite ^(.*)$ https://$host$1 permanent;
    }

    server {
        listen 443 ssl;
        server_name paper.xunmaw.com;
        ssl_certificate cert/paper.xunmaw.com.pem;
        ssl_certificate_key cert/paper.xunmaw.com.key;
        ssl_session_timeout 5m;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        client_max_body_size 50m;

        location / {
            root /opt/paper/web/dist;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location /prod-api/ {
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_pass         http://127.0.0.1:6039/;
            proxy_redirect     off;
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/paper/assets/ {
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Host $http_host;
            proxy_pass         http://127.0.0.1:6039;
        }
    }
