# paper.xunmaw.com — 宿主机 Nginx 配置
# 安装: 复制到 /etc/nginx/conf.d/paper.xunmaw.com.conf
# 证书: /etc/nginx/ssl/paper.xunmaw.com.pem / paper.xunmaw.com.key

upstream paper_backend {
    server 127.0.0.1:6039;
    keepalive 32;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name paper.xunmaw.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paper.xunmaw.com;

    ssl_certificate     /etc/nginx/ssl/paper.xunmaw.com.pem;
    ssl_certificate_key /etc/nginx/ssl/paper.xunmaw.com.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:PaperSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss font/truetype font/opentype image/svg+xml;

    root /opt/paper/web/dist;
    index index.html;

    access_log /var/log/nginx/paper.xunmaw.com.access.log;
    error_log  /var/log/nginx/paper.xunmaw.com.error.log;

    # 后端 API（前端 VITE_API_URL=/prod-api）
    location /prod-api/ {
        proxy_pass http://paper_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # SSE / 流式响应
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # 论文资源直链（后端 security 白名单）
    location /api/paper/assets/ {
        proxy_pass http://paper_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
    }
}
